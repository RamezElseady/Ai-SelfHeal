apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-oom-app
  namespace: default
  labels:
    app: test-oom-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-oom-app
  template:
    metadata:
      labels:
        app: test-oom-app
    spec:
      containers:
      - name: app
        image: python:3.9-slim
        command: ["python", "-c", "x = 'A' * (100 * 1024 * 1024); import time; time.sleep(3600)"]
        resources:
          requests:
            memory: "10Mi"
            cpu: "50m"
          limits:
            memory: "20Mi"
            cpu: "100m"

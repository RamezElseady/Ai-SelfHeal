alertmanager:
  config:
    resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'ai-devops-agent'
      routes:
      - match:
          alertname: 'ContainerOOMKilled'
        receiver: 'ai-devops-agent'
      - match:
          severity: 'critical'
        receiver: 'ai-devops-agent'

    receivers:
    - name: 'ai-devops-agent'
      webhook_configs:
      - url: 'http://ai-devops-webhook-svc/webhook'
        send_resolved: false
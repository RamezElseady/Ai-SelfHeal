apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-cpu-stress
  labels:
    app: test-cpu-stress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-cpu-stress
  template:
    metadata:
      labels:
        app: test-cpu-stress
    spec:
      containers:
      - name: stress-app
        image: alpine
        # الأمر ده بيعمل ضغط متواصل 100% على الـ CPU المتاح ليه
        command: ["/bin/sh", "-c", "md5sum /dev/zero"]
        resources:
          requests:
            cpu: "50m"
          limits:
            cpu: "100m" # أول ما البود يوصل للرقم ده بروميثيوس هيضرب تنبيه
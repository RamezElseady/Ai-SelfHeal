apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-devops-webhook
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-devops-webhook
  template:
    metadata:
      labels:
        app: ai-devops-webhook
    spec:
      serviceAccountName: ai-devops-webhook-sa
      containers:
      - name: webhook
        image: 885427126187.dkr.ecr.us-east-1.amazonaws.com/ai-devops-webhook:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-bot-secrets
              key: GOOGLE_API_KEY
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: ai-bot-secrets
              key: SLACK_WEBHOOK_URL
        - name: MEM_INCREASE_FACTOR
          value: "5.0"  
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: code-volume
          mountPath: /app/app.py   
          subPath: app.py
      volumes:
      - name: code-volume
        configMap:
          name: webhook-code-cm
---
apiVersion: v1
kind: Service
metadata:
  name: ai-devops-webhook-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: ai-devops-webhook
  ports:
  - port: 80
    targetPort: 5000

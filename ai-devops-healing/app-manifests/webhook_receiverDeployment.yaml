apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-devops-webhook
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-devops-webhook
  template:
    metadata:
      labels:
        app: ai-devops-webhook
    spec:
      serviceAccountName: ai-devops-webhook-sa
      containers:
      - name: webhook
        image: 885427126187.dkr.ecr.us-east-1.amazonaws.com/:ai-devops-webhook:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: GOOGLE_API_KEY
          value: "AQ.Ab8RN6Lryc6iGFXfTqaERYO9Q2peWRUe6b3nqVAb4HEiaDpJaQ"
        - name: SLACK_WEBHOOK_URL
          value: "https://hooks.slack.com/services/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"
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-devops-webhook-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: ai-devops-webhook
  ports:
  - port: 80
    targetPort: 5000







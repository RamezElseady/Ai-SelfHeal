apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-devops-webhook-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["pods", "events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-devops-webhook-binding
subjects:
- kind: ServiceAccount
  name: ai-devops-webhook-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: ai-devops-webhook-role
  apiGroup: rbac.authorization.k8s.io
